# The iPhone/iPad app (xcodegen: `make ios-app` generates build/ios/LASRecomp.xcodeproj from this).
#
# The Makefile builds what is not Xcode's business - the static iOS SDL3 + FFmpeg (tools/build_deps_ios.sh), the
# recompiled game code for the iOS guest base (make ios-game-lib -> build/ios/liblasgame_ios.a) and the generated
# SMAA shader include (build/inc/smaa_hlsl.inc). Xcode builds the runtime itself and signs/installs the app, so the
# runtime sources stay navigable and debuggable.
name: LASRecomp
options:
  bundleIdPrefix: com.konradkern
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    # xcode-select on this machine points at the Command Line Tools: DEVELOPER_DIR selects Xcode for xcodebuild.
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    GCC_C_LANGUAGE_STANDARD: gnu11
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    # Use the original module base with a compact runtime window that fits the Air 4's normal address space.
    RT_BASE: "0x7000000000"

targets:
  LASRecomp:
    type: application
    platform: iOS
    sources:
      - path: ../runtime
        excludes:
          - "platform/macos.c"      # desktop host layers
          - "platform/linux.c"
          - "platform/windows.c"
          - "platform/windows.rc"
          - "platform/win_compat.h"
          - "platform/linux_compat.h"
          - "nvn/vulkan/**"         # Vulkan is Windows/Linux only
          - "gamebuild.c"           # builds the game code by spawning a compiler: not possible on iOS
      - path: ../third_party/imgui
        includes:
          - "imgui.cpp"
          - "imgui_draw.cpp"
          - "imgui_tables.cpp"
          - "imgui_widgets.cpp"
          - "backends/imgui_impl_sdl3.cpp"
          - "backends/imgui_impl_metal.mm"
      - path: Assets.xcassets
        buildPhase: resources
      # The substitute font for the game's text (Switch games use the console's own fonts; this app ships the OFL
      # Baloo 2 instead - see runtime/hle/pl.c) and its license.
      - path: ../third_party/fonts/Baloo2/Baloo2-SemiBold.ttf
        buildPhase: resources
      - path: ../third_party/fonts/Baloo2/OFL.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: LAS Recomp
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: LASRecomp.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.konradkern.lasrecomp
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../runtime"
          - "$(SRCROOT)/../runtime/nvn"
          - "$(SRCROOT)/../runtime/nvn/maxwell"
          - "$(SRCROOT)/../third_party/imgui"
          - "$(SRCROOT)/../third_party/imgui/backends"
          - "$(SRCROOT)/../third_party/smaa/Textures"
          - "$(SRCROOT)/../build/inc"                 # smaa_hlsl.inc (runtime/nvn/smaa_data.c)
          - "$(SRCROOT)/../build/ios/deps/include"    # SDL3 + FFmpeg headers
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "LARECOMP_STATIC_GAMELIB=1"               # the game code is linked in, not dlopen'd
          - "LARECOMP_COMPACT_GUEST=1"                # 2.5625 GB window; no extended-addressing entitlement
          - "RT_BASE=$(RT_BASE)"                      # the guest window base (Makefile IOS_BASE_MAIN)
        OTHER_CFLAGS:
          - "-Wno-deprecated-declarations"
        OTHER_LDFLAGS:
          - "$(SRCROOT)/../build/ios/liblasgame_ios.a"    # the recompiled game code (make ios-game-lib)
          - "$(SRCROOT)/../build/ios/deps/lib/libSDL3.a"
          - "$(SRCROOT)/../build/ios/deps/lib/libavformat.a"
          - "$(SRCROOT)/../build/ios/deps/lib/libavcodec.a"
          - "$(SRCROOT)/../build/ios/deps/lib/libswscale.a"
          - "$(SRCROOT)/../build/ios/deps/lib/libavutil.a"
          - "-lz"
          - "-lbz2"
          - "-liconv"
          - "-lpthread"
          - "-framework UIKit"
          - "-framework Foundation"
          - "-framework CoreGraphics"
          - "-framework CoreMedia"
          - "-framework CoreVideo"
          - "-framework CoreAudio"
          - "-framework AudioToolbox"
          - "-framework AVFoundation"
          - "-framework CoreBluetooth"
          - "-framework CoreMotion"
          - "-framework GameController"
          - "-framework Metal"
          - "-framework MetalFX"
          - "-framework QuartzCore"
          - "-framework OpenGLES"
          - "-framework ImageIO"
          - "-framework UniformTypeIdentifiers"
          - "-weak_framework CoreHaptics"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
